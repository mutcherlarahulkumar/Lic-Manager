name: Android APK Release

# Builds the Android app and publishes the APK as a GitHub Release on every
# push to main. Each push creates/updates a release tagged with the short SHA.
#
# Prerequisites (one-time, see android/README.md):
#   * Commit a Gradle wrapper (`cd android && gradle wrapper`) so ./gradlew exists.
#   * For a *signed* release APK, add repo secrets KEYSTORE_BASE64,
#     KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD and wire the signingConfig in
#     app/build.gradle.kts. Until then this builds the unsigned debug APK.

on:
  push:
    branches: [ main ]

permissions:
  contents: write   # required to create releases

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        # Switch to :app:assembleRelease once signing secrets are configured.
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../out/bma-${GITHUB_SHA::7}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: BMA build ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
