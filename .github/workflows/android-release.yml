name: Android APK Release

# Builds the Android app and publishes the APK as a GitHub Release on every
# push to main. Also runnable manually from the Actions tab.
#
# Why the earlier run failed: the job called ./gradlew, but no Gradle wrapper
# was committed, so the step errored with "no such file". This workflow instead
# provisions Gradle via gradle/actions/setup-gradle and generates the wrapper on
# the runner, so no wrapper needs to live in the repo.

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android-release.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          fi

      - name: Build debug APK
        # Switch to :app:assembleRelease once signing secrets are configured.
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../out/bma-${GITHUB_SHA::7}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: BMA build ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
