name: Android APK Release

# Builds the Android app and publishes the APK as a GitHub Release on every
# push to main. Also runnable manually from the Actions tab.
#
# Failure history & fixes:
#   * 1st failure: called ./gradlew but no wrapper was committed.
#   * 2nd failure: android-actions/setup-android@v3 tried to install the obsolete
#     'tools' SDK package ("Failed to find package 'tools'") and exited 1.
#   Fix: the ubuntu-latest runner already ships the Android SDK (ANDROID_HOME),
#   so we drop setup-android, accept licenses defensively, and let Gradle
#   (provisioned by setup-gradle) build. First-party actions pinned to Node24
#   versions to clear the "Node.js 20 is deprecated" warning.

on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android-release.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Accept Android SDK licenses
        # SDK is preinstalled on the runner; just make sure licenses are accepted
        # so AGP can fetch any missing platform/build-tools.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        # Uses the Gradle provisioned above (no committed wrapper needed).
        # Switch to :app:assembleRelease once signing secrets are configured.
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../out/bma-${GITHUB_SHA::7}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: BMA build ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
